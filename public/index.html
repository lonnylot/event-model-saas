<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Event Model</title>
    <link rel="icon" href="/favicon.png" />
    <link rel="stylesheet" href="/shell.css" />
    <meta property="og:image" content="/og.png" />
    <meta property="og:title" content="Event Model" />
    <meta property="og:description" content="Access is by invite." />
  </head>
  <body class="login">
    <a href="/">Event Model</a>
    <a href="/login">Sign in</a>
    <main>
      <h1>Event Modeling for the whole team</h1>
      <p>One Event Model, signed in. No passing files around.</p>
      <p>Access is by invite.</p>
      <form id="login">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="username" required />
        <button type="submit">Email me a link</button>
      </form>
      <p id="status" hidden></p>
    </main>
    <script src="/login.js"></script>
  </body>
</html>
